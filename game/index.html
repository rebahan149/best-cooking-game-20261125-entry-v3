<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Trattoria Sole — a two-chef trattoria rush. A cooking and time-management game: work Bruno and Rosa around a tile-grid Italian kitchen, chop and toss ingredients, mind the PERFECT window on the pans and the brick forno, plate eight dishes and serve the dining room before patience runs out. Controls: WASD move, Space interact, Q swap chef, F bell, mouse click to set the chalk route.">
<title>Trattoria Sole — a two-chef trattoria rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100b; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; box-shadow: 0 0 60px rgba(0,0,0,0.6); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Trattoria Sole: move a chef with WASD, press Space at counters to prep ingredients, watch the pans for the PERFECT window, plate each dish and serve it at the pass before the ticket's patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
